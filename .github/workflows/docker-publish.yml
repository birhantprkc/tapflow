name: Docker Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  pull_request:

env:
  IMAGE: tapflow/tapflow

jobs:
  # Build each architecture on its own native runner. arm64 used to build under
  # QEMU emulation on an amd64 runner, where the native module compile could hang
  # for hours; native runners remove the emulation entirely.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
    steps:
      - name: Prepare platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Warn when Docker Hub credentials are missing
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN are not set — building the image for validation but skipping push."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build image (push by digest when publishing)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          # Publish: push a per-architecture image by digest (merged into a manifest
          # list in the merge job). Otherwise (PR / no credentials): load the
          # built image into Docker so the runtime smoke test exercises it.
          outputs: ${{ (github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true') && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || format('type=docker,name=tapflow-smoke:{0}', env.PLATFORM_PAIR) }}

      - name: Select image for smoke test
        run: |
          if [ "${HAS_DOCKERHUB}" = "true" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "SMOKE_IMAGE=${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          else
            echo "SMOKE_IMAGE=tapflow-smoke:${PLATFORM_PAIR}" >> "$GITHUB_ENV"
          fi

      - name: Smoke test image runtime
        timeout-minutes: 5
        run: |
          set -euo pipefail

          container="tapflow-smoke-${PLATFORM_PAIR}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="${container}-data"
          root_body="${RUNNER_TEMP}/tapflow-smoke-root.txt"
          api_body="${RUNNER_TEMP}/tapflow-smoke-auth-status.txt"

          diagnose_container() {
            if docker inspect "$container" >/dev/null 2>&1; then
              docker inspect -f 'Container exists: true
          State.Status={{.State.Status}}
          State.ExitCode={{.State.ExitCode}}
          State.OOMKilled={{.State.OOMKilled}}' "$container" 2>/dev/null || true
            else
              echo "Container exists: false"
            fi
          }

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Smoke container diagnostics:" >&2
              diagnose_container >&2
              docker logs --tail 50 "$container" || true
            fi
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          start_container() {
            docker run -d \
              --name "$container" \
              -p 127.0.0.1:4000:4000 \
              -v "$volume:/app/.tapflow/data" \
              "$SMOKE_IMAGE" >/dev/null
          }

          wait_for_ready() {
            phase="$1"
            for attempt in $(seq 1 20); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$container")" != "true" ]; then
                echo "Container exited before readiness during ${phase} (attempt ${attempt})." >&2
                return 1
              fi

              root_status="$(curl --connect-timeout 2 --max-time 2 -sS -o "$root_body" -w '%{http_code}' http://127.0.0.1:4000/ || true)"
              api_status="$(curl --connect-timeout 2 --max-time 2 -sS -o "$api_body" -w '%{http_code}' http://127.0.0.1:4000/api/v1/auth/status || true)"
              if [ "$root_status" -ge 200 ] && [ "$root_status" -lt 400 ] \
                && [ "$api_status" -ge 200 ] && [ "$api_status" -lt 400 ] \
                && grep -Fq '<title>tapflow</title>' "$root_body" \
                && grep -Eq '"initialized":(true|false)' "$api_body"; then
                echo "Smoke test ${phase} passed with HTTP /=${root_status} and /api/v1/auth/status=${api_status}."
                return 0
              fi

              sleep 2
            done

            echo "Relay did not return the expected HTTP responses on :4000 during ${phase}." >&2
            echo "Last observed HTTP statuses: /=${root_status:-none}, /api/v1/auth/status=${api_status:-none}." >&2
            return 1
          }

          jwt_secret_fingerprint() {
            docker exec "$container" sh -eu -c \
              'if [ ! -s /app/.tapflow/data/jwt-secret ]; then
                echo "JWT secret file is missing or empty." >&2
                exit 1
              fi
              sha256sum /app/.tapflow/data/jwt-secret | cut -d " " -f1'
          }

          docker volume create "$volume" >/dev/null
          start_container
          wait_for_ready "first boot"

          node scripts/docker-publish-websocket-smoke.mjs

          first_jwt_secret="$(jwt_secret_fingerprint)"

          docker rm -f "$container" >/dev/null
          start_container
          wait_for_ready "restart"
          second_jwt_secret="$(jwt_secret_fingerprint)"

          if [ "$first_jwt_secret" != "$second_jwt_secret" ]; then
            echo "JWT secret did not persist across container recreation." >&2
            exit 1
          fi
          echo "JWT secret persisted across container recreation."

      - name: Export digest
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request' && env.HAS_DOCKERHUB == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-architecture digests into a single multi-arch manifest list.
  # Only runs for real publishes; PRs and credential-less builds validate only.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' && secrets.DOCKERHUB_USERNAME != '' }}
      # A second flag rather than a longer `if`, because the `secrets` context is not available in a
      # step-level `if` — which is why `HAS_DOCKERHUB` above exists at all rather than being inlined.
      HAS_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN != '' }}
      # Lowercased because a registry path must be, and `github.repository` carries the owner's
      # capitalisation. `jo-duchan/tapflow` happens to be lowercase already; a fork whose owner is not
      # would push to a path the registry rejects, and the failure names the tag rather than the case.
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      # `ghcr.io` takes `GITHUB_TOKEN`, so the second registry needs no secret and nothing that
      # expires. The repository default is `read`, so without this line the push is a 403.
      packages: write
    steps:
      - name: Note validation-only build
        if: env.HAS_DOCKERHUB != 'true'
        run: echo "::warning::No Docker Hub credentials — per-architecture validation builds succeeded, nothing to publish."

      - name: Download digests
        if: env.HAS_DOCKERHUB == 'true'
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags) for Docker
        id: meta
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifest list and push
        if: env.HAS_DOCKERHUB == 'true'
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046  # intentional split: expand -t flags and per-digest refs
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        if: env.HAS_DOCKERHUB == 'true'
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

      # ── A second registry, copied rather than built twice ──────────────────────────────────────
      #
      # **Why a copy and not a second push from the build job.** `buildx` does take repeated image
      # outputs, so the build could push by digest to both registries and neither would depend on the
      # other. That is the better shape and it is not the one to land first: it rewrites the
      # `outputs:` expression that drives the Docker Hub push, and **nothing here can be rehearsed**
      # — the push path is skipped on pull requests, so its first run is on `main`. A mistake there
      # stops releases. Everything below runs after Docker Hub already has the manifest, so the worst
      # it can do is fail by itself.
      #
      # The cost is honest: if Docker Hub is down, GHCR gets nothing that day. That matters less than
      # it sounds, because a failed Hub push is loud — this is the registry that answers when someone
      # hits Docker Hub's anonymous pull limit, not a hot standby.
      - name: Log in to GHCR
        if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` with a source copies the manifest list and any blobs the destination is
      # missing, so the architectures and the attestations arrive without a rebuild. The tags are the
      # ones `metadata-action` already worked out, with the registry swapped.
      - name: Copy the manifest to GHCR
        if: env.HAS_DOCKERHUB == 'true'
        env:
          TAGS_JSON: ${{ steps.meta.outputs.json }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # An array rather than the word-split the sibling step disables SC2046 for: a tag can carry
          # no whitespace today, and building the flags as elements means that stays true by shape.
          #
          # `sub(".*:"; "")` is greedy on purpose — it keeps what follows the *last* colon. Anchoring
          # on the first one reads the port of a `registry:5000/foo:1.2.3` as the tag.
          args=()
          while IFS= read -r tag; do
            echo "copying to: $tag"
            args+=(-t "$tag")
          done < <(jq -r --arg img "$GHCR_IMAGE" '.tags[] | sub(".*:"; "") | $img + ":" + .' <<< "$TAGS_JSON")
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${VERSION}"

      - name: Inspect the GHCR image
        if: env.HAS_DOCKERHUB == 'true'
        run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}

      # **The page a first-time visitor lands on, which was blank while the image was pulled 7,768
      # times.** Nothing here pushed a description, so it was set by hand or not at all — and a file
      # in the repo without this step is a file nobody reads, which is why one arriving alone was
      # dropped from #713. The file and the step go together or neither does.
      #
      # **Gated on its own secret, and that is not tidiness.** The action needs a PAT with
      # `read/write/delete`; `DOCKERHUB_TOKEN` is documented as Read & Write, so it may not carry the
      # scope to edit repository metadata. Hanging this off `HAS_DOCKERHUB` would then redden every
      # push to `main` for a reason that has nothing to do with the image — and this workflow is not
      # a required check, so a permanently red run is how nobody notices the day the *push* breaks.
      # Set `DOCKERHUB_DESCRIPTION_TOKEN` to turn it on; until then the step is skipped and the page
      # stays as it is.
      # **This job has no checkout of its own**, because merging digests into a manifest needs the
      # registry and nothing from the repository. The step below is the first thing here that reads a
      # file, so it has to bring one — without this it would fail on a missing path the moment the
      # secret was set, which is the failure the gate above exists to avoid, arriving by another door.
      #
      # Sparse, so what the job depends on is one line rather than the whole tree, and anyone tidying
      # a checkout that looks unused can see what it is for.
      - name: Check out the overview
        if: env.HAS_DOCKERHUB == 'true' && env.HAS_DESCRIPTION_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: docker/hub-overview.md
          sparse-checkout-cone-mode: false

      - name: Push the Docker Hub overview
        if: env.HAS_DOCKERHUB == 'true' && env.HAS_DESCRIPTION_TOKEN == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
          repository: ${{ env.IMAGE }}
          readme-filepath: ./docker/hub-overview.md
          short-description: >-
            Relay server for tapflow — self-hosted iOS & Android simulator streaming for your whole team
